services:
  - type: web
    name: job-hunter-africa
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 jobhunter_server.py"
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: MODEL
        value: gpt-6-luna
      - key: PORTKEY_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
